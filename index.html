      <div class="quiz-opts">${q.o.map((o, i) => {
        let cls = '';
        if (sel !== undefined) { if (i === q.a) cls = 'right'; else if (i === sel) cls = 'wrong'; }
        return `<button class="opt ${cls}" type="button" data-quiz="${t.id}" data-i="${i}">${esc(o)}</button>`;
      }).join('')}</div>
      <p class="quiz-fb">${esc(fb)}</p>`;
  }

  /* ---------- Pages ---------- */
  function renderHome() {
    const total = C.topics.length;
    const done = P.done.length;
    const pct = Math.round(done / total * 100);
    const rows = C.chapters.map(ch => {
      const ts = topicsIn(ch.id);
      const mins = ts.reduce((a, t) => a + parseInt(t.time, 10), 0);
      return `<tr><td><a href="#/topic/${ts[0].id}">${esc(ch.title)}</a></td><td>${esc(ch.blurb)}</td><td>${ts.length}</td><td>${mins} min</td></tr>`;
    }).join('');
    return `
      <div class="crumb">Learning guide for software testers</div>
      <h1>ROBBERCAT's Journey</h1>
      <p class="lead">A structured guide from testing fundamentals to CI/CD, system design and quality analysis. Each lesson explains a concept, works through a realistic example, and ends with a practice task.</p>

      <h2>How the guide is organized</h2>
      <p>The guide has seven chapters that build on one another. Read them in order the first time. Each lesson is self-contained enough to return to later as a reference, and the glossary collects the terms in one place.</p>
      <div class="table-wrap"><table class="overview-table">
        <thead><tr><th>Chapter</th><th>What you learn</th><th>Lessons</th><th>Estimated time</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>

      <div class="progress-box">
        <div><strong>Your progress</strong><div class="muted small">${done} of ${total} lessons marked complete on this device</div></div>
        <div class="progress-track"><i style="width:${pct}%"></i></div>
        <span class="small muted">${pct}%</span>
      </div>

      <div class="complete-row">
        <a class="btn primary" href="#/topic/${C.topics[0].id}">Start with lesson 1</a>
        <a class="btn" href="#/lab/pipeline">Open the labs</a>
        <a class="btn" href="#/glossary">Browse the glossary</a>
      </div>

      <h2>Conventions used in this guide</h2>
      <p>Code samples use TypeScript with Playwright or Python with pytest unless a lesson says otherwise. Tables in worked examples show expected results, so you can check your own work against them. Callouts flag the points where readers most often make mistakes.</p>
      <div class="callout"><strong>Tip</strong><p>Read the worked example before the code. It states the goal, and the explanation after the code tells you what to notice.</p></div>
    `;
  }

  function renderTopic(id) {
    const t = topicById(id) || C.topics[0];
    const ch = chapterOf(t);
    const idx = C.topics.indexOf(t);
    const prev = C.topics[idx - 1];
    const next = C.topics[idx + 1];
    const done = isDone(t.id);
    const visual = t.visual && V[t.visual] ? V[t.visual]() : '';
    return `
      <div class="crumb"><a href="#/">Guide</a><span class="sep">/</span><span>${esc(ch.title)}</span></div>
      <h1>${esc(t.title)}</h1>
      <p class="lead">${esc(t.summary)}</p>
      <div class="meta"><span>Lesson ${numberOf(t)} of ${C.topics.length}</span><span>${esc(t.time)}</span><span>${esc(ch.title)}</span></div>

      ${visual}

      ${t.sections.map(s => `<section><h2>${esc(s.h)}</h2>${s.p.map(p => `<p>${esc(p)}</p>`).join('')}</section>`).join('')}

      ${exampleBlock(t.example)}

      <section class="keypoints"><h2>Key points</h2>
        <ul>${t.keypoints.map(k => `<li>${esc(k)}</li>`).join('')}</ul>
      </section>

      ${t.lab ? `<div class="callout"><strong>Interactive lab</strong><p>This lesson has a lab that lets you change the inputs and see the result. <a href="#/lab/${t.lab}">Open the lab</a>.</p></div>` : ''}

      <div class="task"><h3>Practice task</h3><p>${esc(t.task)}</p></div>

      <div class="quiz" id="quiz">${quizBlock(t, P.quiz[t.id] === undefined ? undefined : (P.quiz[t.id] ? t.quiz.a : -1))}</div>

      <div class="complete-row">
        <button class="btn ${done ? 'done' : 'primary'}" type="button" data-done="${t.id}">${done ? '✓ Marked complete' : 'Mark as complete'}</button>
      </div>

      <nav class="pager">
        ${prev ? `<a href="#/topic/${prev.id}">← ${esc(prev.title)}</a>` : '<span></span>'}
        ${next ? `<a href="#/topic/${next.id}">${esc(next.title)} →</a>` : '<span></span>'}
      </nav>`;
  }

  function renderLabsShell(current) {
    return `
      <div class="crumb"><a href="#/">Guide</a><span class="sep">/</span><span>Interactive labs</span></div>
      <h1>Interactive labs</h1>
      <p class="lead">Change the inputs and observe the result. Each lab corresponds to a lesson, and the notes explain what the result means.</p>
      <nav class="seg">${LABS.map(l => `<a class="${l.id === current ? 'on' : ''}" href="#/lab/${l.id}">${l.name}</a>`).join('')}</nav>
      <div class="lab-panel" id="lab-body"></div>`;
  }

  function renderGlossary() {
    return `
      <div class="crumb"><a href="#/">Guide</a><span class="sep">/</span><span>Glossary</span></div>
      <h1>Glossary</h1>
      <p class="lead">Plain-language definitions of the terms used across the guide.</p>
      <input id="gl-search" class="search" type="search" placeholder="Filter terms" aria-label="Filter glossary terms">
      <dl class="gloss" id="gl-list">
        ${C.glossary.map(g => `<div class="gl-item" data-term="${esc(g.term.toLowerCase())}"><dt>${esc(g.term)}</dt><dd>${esc(g.def)}</dd></div>`).join('')}
      </dl>`;
  }

  /* ---------- Labs ---------- */
  const LABS = [
    { id: 'pipeline', name: 'CI pipeline' },
    { id: 'flaky', name: 'Waits and flakiness' },
    { id: 'latency', name: 'Latency percentiles' },
    { id: 'risk', name: 'Risk matrix' }
  ];

  function labPipeline(body) {
    const stages = ['Checkout', 'Install', 'Lint', 'Smoke', 'Regression', 'Report'];
    body.innerHTML = `
      <h2>CI pipeline</h2>
      <p class="muted">Choose a stage to fail and run the pipeline. Later stages are skipped after a failure, which is how a fail-fast pipeline behaves. The report stage always runs, so the evidence is kept.</p>
      <div class="controls">
        <label>Fail at <select id="pl-fail">
          <option value="">Nothing (passing run)</option>
          ${stages.map(s => `<option value="${s}">${s}</option>`).join('')}
        </select></label>
        <button class="btn primary" id="pl-run" type="button">Run pipeline</button>
      </div>
      <div class="stage-row">${stages.map((s, i) => `<div class="stage" data-s="${i}"><b>${s}</b><small>waiting</small></div>`).join('')}</div>
      <ul class="log" id="pl-log" aria-live="polite"></ul>`;
    const logEl = $('#pl-log', body);
    const log = (text, cls) => {
      const li = document.createElement('li');
      li.className = cls || '';
      li.textContent = text;
      logEl.appendChild(li);
      logEl.scrollTop = logEl.scrollHeight;
    };
    $('#pl-run', body).addEventListener('click', async () => {
      const fail = $('#pl-fail', body).value;
      const btn = $('#pl-run', body);
      btn.disabled = true;
      logEl.innerHTML = '';
      $$('.stage', body).forEach(s => { s.className = 'stage'; s.querySelector('small').textContent = 'waiting'; });
      let failed = false;
      for (let i = 0; i < stages.length; i++) {
        const name = stages[i];
        const el = $(`.stage[data-s="${i}"]`, body);
        const state = el.querySelector('small');
        if (failed && name !== 'Report') {
          el.classList.add('skipped');
          state.textContent = 'skipped';
          log(`${name}: skipped because an earlier stage failed`);
          continue;
        }
        el.classList.add('running');
        state.textContent = 'running';
        await wait(600);
        el.classList.remove('running');
        if (name === fail) {
          el.classList.add('fail');
          state.textContent = 'failed';
          log(`${name}: failed with exit code 1`, 'bad');
          failed = true;
        } else {
          el.classList.add('pass');
          state.textContent = 'passed';
          log(`${name}: passed`, 'ok');
        }
      }
      log(failed ? 'Pipeline failed. Fix the failing stage and run again.' : 'Pipeline passed. The build is ready for staging.', failed ? 'bad' : 'ok');
      btn.disabled = false;
    });
  }

  function labFlaky(body) {
    body.innerHTML = `
      <h2>Fixed waits versus waiting for the outcome</h2>
      <p class="muted">A page takes a varying time to become ready. A slower environment stretches that time. A fixed wait either wastes time or fails. A wait for the outcome adapts to the page as it actually is.</p>
      <div class="controls">
        <label class="grow">Environment slowdown <strong id="fl-val">1.0</strong>×
          <input id="fl-slow" type="range" min="1" max="4" step="0.1" value="1"></label>
        <button class="btn primary" id="fl-run" type="button">Simulate 200 tests</button>
      </div>
      <div class="compare">
        <div class="cmp"><h3>Fixed wait of 2 seconds</h3><div class="big" id="fl-sleep">–</div><p>Always takes 2 seconds, even when the page is ready sooner.</p></div>
        <div class="cmp"><h3>Wait for the outcome, up to 5 seconds</h3><div class="big" id="fl-cond">–</div><p id="fl-cond-note">Ends as soon as the page is ready.</p></div>
      </div>
      <p class="muted small" style="margin-top:14px">Each page becomes ready after a random 0.6 to 1.4 seconds, multiplied by the slowdown.</p>`;
    const slow = $('#fl-slow', body);
    const run = () => {
      const s = +slow.value;
      $('#fl-val', body).textContent = s.toFixed(1);
      let sleepPass = 0, condPass = 0, condTime = 0;
      for (let i = 0; i < 200; i++) {
        const ready = (600 + Math.random() * 800) * s;
        if (ready <= 2000) sleepPass++;
        if (ready <= 5000) { condPass++; condTime += ready; }
      }
      $('#fl-sleep', body).textContent = Math.round(sleepPass / 2) + '% pass';
      $('#fl-cond', body).textContent = Math.round(condPass / 2) + '% pass';
      $('#fl-cond-note', body).textContent = 'Average ' + (condTime / Math.max(condPass, 1) / 1000).toFixed(2) + ' s per test. Ends as soon as the page is ready.';
    };
    slow.addEventListener('input', run);
    $('#fl-run', body).addEventListener('click', run);
    run();
  }

  function labLatency(body) {
    body.innerHTML = `
      <h2>Why averages mislead</h2>
      <p class="muted">Simulate 500 requests. Most are fast, but some are slow. Compare the average with the percentiles, which describe what users actually experience.</p>
      <div class="controls">
        <label class="grow">Spread of slow requests <strong id="lt-val">0.40</strong>
          <input id="lt-tail" type="range" min="0.1" max="1.2" step="0.05" value="0.4"></label>
        <button class="btn primary" id="lt-run" type="button">Resample</button>
      </div>
      <div class="hist" id="lt-hist"></div>
      <div class="stats-row" id="lt-stats"></div>
      <p class="muted small" style="margin-top:14px">Objective used here: p95 should stay under 500 ms.</p>`;
    const tail = $('#lt-tail', body);
    const draw = () => {
      const sigma = +tail.value;
      $('#lt-val', body).textContent = sigma.toFixed(2);
      const xs = [];
      for (let i = 0; i < 500; i++) {
        const u = Math.random() || 1e-9;
        const v = Math.random();
        xs.push(Math.exp(Math.log(180) + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v)));
      }
      xs.sort((a, b) => a - b);
      const pick = p => xs[Math.min(xs.length - 1, Math.floor(p * xs.length))];
      const avg = xs.reduce((a, b) => a + b, 0) / xs.length;
      const p50 = pick(0.5), p95 = pick(0.95), p99 = pick(0.99);
      const max = xs[xs.length - 1], B = 24, counts = Array(B).fill(0);
      xs.forEach(x => counts[Math.min(B - 1, Math.floor(x / max * B))]++);
      const peak = Math.max(...counts);
      $('#lt-hist', body).innerHTML = counts.map((c, i) =>
        `<div class="hbar" style="height:${Math.max(2, c / peak * 100)}%" title="${Math.round(i * max / B)} to ${Math.round((i + 1) * max / B)} ms: ${c} requests"></div>`).join('');
      $('#lt-stats', body).innerHTML = [['Average', avg], ['p50', p50], ['p95', p95], ['p99', p99]].map(([k, v]) =>
        `<div class="metric"><b>${Math.round(v)} ms</b><span>${k}</span></div>`).join('') +
        `<div class="metric ${p95 <= 500 ? 'ok' : 'bad'}"><b>${p95 <= 500 ? 'Met' : 'Missed'}</b><span>p95 objective</span></div>`;
    };
    tail.addEventListener('input', draw);
    $('#lt-run', body).addEventListener('click', draw);
    draw();
  }

  function labRisk(body) {
    body.innerHTML = `
      <h2>Risk matrix</h2>
      <p class="muted">Add a risk and rate its likelihood and impact from 1 (low) to 3 (high). The score is likelihood multiplied by impact. Scores of 6 to 9 are high priority.</p>
      <div class="controls">
        <input id="rk-name" class="grow" type="text" placeholder="Describe the risk" aria-label="Risk description">
        <select id="rk-l" aria-label="Likelihood">
          <option value="1">Likelihood: low</option><option value="2">Likelihood: medium</option><option value="3">Likelihood: high</option>
        </select>
        <select id="rk-i" aria-label="Impact">
          <option value="1">Impact: low</option><option value="2">Impact: medium</option><option value="3">Impact: high</option>
        </select>
        <button class="btn primary" id="rk-add" type="button">Add risk</button>
      </div>
      <div class="risk-wrap">
        <div><div class="rmatrix" id="rk-grid"></div></div>
        <ul class="rlist" id="rk-list"></ul>
      </div>`;
    const risks = [];
    const level = s => s >= 6 ? 'high' : s >= 3 ? 'med' : 'low';
    const label = s => s >= 6 ? 'High' : s >= 3 ? 'Medium' : 'Low';
    const draw = () => {
      const grid = $('#rk-grid', body);
      grid.innerHTML = '';
      for (let l = 3; l >= 1; l--) for (let i = 1; i <= 3; i++) {
        const count = risks.filter(r => r.l === l && r.i === i).length;
        const cell = document.createElement('div');
        cell.className = 'rcell ' + level(l * i);
        cell.textContent = count || '';
        cell.title = 'Likelihood ' + l + ', impact ' + i + ', score ' + (l * i);
        grid.appendChild(cell);
      }
      $('#rk-list', body).innerHTML = risks.length
        ? risks.map(r => { const s = r.l * r.i; return `<li class="${level(s)}">${esc(r.name)}<span>${r.l} × ${r.i} = ${s}, ${label(s)} priority</span></li>`; }).join('')
        : '<li class="muted">No risks yet. Add one to place it on the matrix.</li>';
    };
    $('#rk-add', body).addEventListener('click', () => {
      const name = $('#rk-name', body).value.trim() || 'Unnamed risk';
      risks.push({ name, l: +$('#rk-l', body).value, i: +$('#rk-i', body).value });
      $('#rk-name', body).value = '';
      draw();
    });
    draw();
  }

  const LAB_FN = { pipeline: labPipeline, flaky: labFlaky, latency: labLatency, risk: labRisk };

  /* ---------- Router ---------- */
  function route() {
    const parts = (location.hash || '#/').replace(/^#\/?/, '').split('/');
    const name = parts[0] || 'home';
    const arg = parts[1];
    let html, routeKey = name;

    if (name === 'topic') html = renderTopic(arg);
    else if (name === 'lab') { html = renderLabsShell(arg || 'pipeline'); routeKey = 'lab'; }
    else if (name === 'glossary') html = renderGlossary();
    else { html = renderHome(); routeKey = 'home'; }

    main.innerHTML = `<div class="page page-enter">${html}</div>`;
    if (name === 'lab') (LAB_FN[arg] || LAB_FN.pipeline)($('#lab-body'));
    if (name === 'glossary') bindGlossary();
    setActive(name === 'topic' ? 'topic/' + (arg || C.topics[0].id) : routeKey === 'home' ? 'home' : name);
    window.scrollTo(0, 0);
    closeSidebar();

    const titles = {
      topic: (topicById(arg) || C.topics[0]).title,
      lab: 'Interactive labs',
      glossary: 'Glossary'
    };
    document.title = (titles[name] ? titles[name] + ' · ' : '') + 'ROBBERCAT\u2019s Journey';
    buildSidebar();
    setActive(name === 'topic' ? 'topic/' + (arg || C.topics[0].id) : name === 'lab' ? 'lab' : name);
  }

  function bindGlossary() {
    const input = $('#gl-search');
    input.addEventListener('input', () => {
      const q = input.value.trim().toLowerCase();
      $$('.gl-item').forEach(item => { item.style.display = item.dataset.term.includes(q) ? '' : 'none'; });
    });
  }

  /* ---------- Mobile sidebar ---------- */
  const sidebar = $('#sidebar');
  const scrim = $('#scrim');
  function openSidebar() { sidebar.classList.add('open'); scrim.classList.add('open'); }
  function closeSidebar() { sidebar.classList.remove('open'); scrim.classList.remove('open'); }
  $('#menuBtn').addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
  scrim.addEventListener('click', closeSidebar);

  /* ---------- Global clicks ---------- */
  document.addEventListener('click', e => {
    const done = e.target.closest('[data-done]');
    if (done) {
      const id = done.dataset.done;
      toggleDone(id);
      const on = isDone(id);
      done.textContent = on ? '✓ Marked complete' : 'Mark as complete';
      done.classList.toggle('done', on);
      done.classList.toggle('primary', !on);
      buildSidebar();
      setActive('topic/' + id);
      return;
    }
    const quiz = e.target.closest('[data-quiz]');
    if (quiz) {
      const t = topicById(quiz.dataset.quiz);
      const i = +quiz.dataset.i;
      P.quiz[t.id] = (i === t.quiz.a);
      save();
      $('#quiz').innerHTML = quizBlock(t, i);
      return;
    }
    const copy = e.target.closest('[data-copy]');
    if (copy && navigator.clipboard) {
      const text = copy.closest('.codeblock').querySelector('code').textContent;
      navigator.clipboard.writeText(text).then(() => {
        copy.textContent = 'Copied';
        setTimeout(() => { copy.textContent = 'Copy'; }, 1400);
      }).catch(() => {});
    }
  });

  /* ---------- Search dialog ---------- */
  const palette = $('#palette');
  const pin = $('#paletteInput');
  const plist = $('#paletteList');
  const ITEMS = [
    { label: 'Home', href: '#/', kind: 'Page', text: 'home guide start' },
    { label: 'Interactive labs', href: '#/lab/pipeline', kind: 'Page', text: 'labs experiments' },
    { label: 'Glossary', href: '#/glossary', kind: 'Page', text: 'glossary terms definitions' }
  ].concat(C.topics.map(t => ({ label: t.title, href: '#/topic/' + t.id, kind: chapterOf(t).title, text: t.title + ' ' + t.summary })));
  let sel = 0;
  const results = () => { const q = pin.value.trim().toLowerCase(); return ITEMS.filter(i => i.text.toLowerCase().includes(q)).slice(0, 10); };
  function drawResults() {
    const res = results();
    plist.innerHTML = res.length
      ? res.map((r, i) => `<li data-href="${r.href}" class="${i === sel ? 'act' : ''}"><span>${esc(r.label)}</span><small>${esc(r.kind)}</small></li>`).join('')
      : '<li class="muted">No matches</li>';
  }
  function markSel() { $$('#paletteList li[data-href]').forEach((li, i) => li.classList.toggle('act', i === sel)); }
  function openSearch() { palette.classList.remove('hidden'); pin.value = ''; sel = 0; drawResults(); pin.focus(); }
  function closeSearch() { palette.classList.add('hidden'); }
  function go(href) { location.hash = href; closeSearch(); }
  pin.addEventListener('input', () => { sel = 0; drawResults(); });
  pin.addEventListener('keydown', e => {
    const n = $$('#paletteList li[data-href]').length;
    if (!n) return;
    if (e.key === 'ArrowDown') { sel = (sel + 1) % n; markSel(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = (sel - 1 + n) % n; markSel(); e.preventDefault(); }
    else if (e.key === 'Enter') { const li = $$('#paletteList li[data-href]')[sel]; if (li) go(li.dataset.href); }
    else if (e.key === 'Escape') closeSearch();
  });
  plist.addEventListener('click', e => { const li = e.target.closest('li[data-href]'); if (li) go(li.dataset.href); });
  palette.addEventListener('click', e => { if (e.target === palette) closeSearch(); });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      palette.classList.contains('hidden') ? openSearch() : closeSearch();
    } else if (e.key === '/' && palette.classList.contains('hidden') && !/input|textarea|select/i.test(document.activeElement.tagName)) {
      e.preventDefault();
      openSearch();
    }
  });
  $('#searchBtn').addEventListener('click', openSearch);

  /* ---------- Theme ---------- */
  const root = document.documentElement;
  let saved = null;
  try { saved = localStorage.getItem('rc-guide-theme'); } catch (e) { /* ignore */ }
  root.dataset.theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  $('#themeBtn').addEventListener('click', () => {
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('rc-guide-theme', root.dataset.theme); } catch (e) { /* ignore */ }
  });

  /* ---------- Start ---------- */
  buildSidebar();
  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
