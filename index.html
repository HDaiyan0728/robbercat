  <style>
/* ==========================================================================
   ROBBERCAT's Journey: documentation-style stylesheet
   Calm palette: warm paper (light) and slate (dark), one muted teal accent.
   ========================================================================== */

:root {
  --bg: #f7f6f2;
  --surface: #ffffff;
  --sidebar: #efeee9;
  --text: #1d2127;
  --muted: #5d6670;
  --border: #e2dfd7;
  --accent: #2e6a6e;
  --accent-text: #245659;
  --accent-soft: #e4eeee;
  --code-bg: #f1f0eb;
  --code-text: #1f2a2e;
  --ok: #2f7a57;
  --warn: #8a5a14;
  --warn-soft: #f6eee0;
  --bad: #a3423b;
  --shadow: 0 1px 2px rgba(20, 24, 30, 0.04), 0 6px 20px rgba(20, 24, 30, 0.04);
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --header-h: 60px;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #14171b;
  --surface: #1a1e23;
  --sidebar: #171b20;
  --text: #e3e6ea;
  --muted: #9aa3ad;
  --border: #2a3038;
  --accent: #7fb3b0;
  --accent-text: #9cc9c6;
  --accent-soft: #1d2b2b;
  --code-bg: #11151a;
  --code-text: #d6dde2;
  --ok: #6cc39a;
  --warn: #e0ae5a;
  --warn-soft: #2a2417;
  --bad: #e1857d;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { font-family: var(--serif); color: var(--text); line-height: 1.25; margin: 0 0 0.6em; font-weight: 600; }
h1 { font-size: 2.25rem; letter-spacing: -0.01em; }
h2 { font-size: 1.5rem; margin-top: 2.2em; padding-top: 0.2em; }
h3 { font-size: 1.15rem; margin-top: 1.6em; font-family: var(--sans); font-weight: 600; }
p { margin: 0 0 1.05em; }
a { color: var(--accent-text); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--text); }
button { font: inherit; color: inherit; }
img, svg { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Header ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); min-width: 0; }
.brand:hover { color: var(--text); }
.mark {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  border-radius: 8px;
  background: var(--accent);
  color: #ffffff;
  display: grid;
  place-items: center;
  font-family: var(--sans);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: -0.02em;
}
.brand-name { font-family: var(--serif); font-size: 1.12rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-name span { color: var(--muted); font-weight: 400; }
.topbar .spacer { flex: 1; }
.tb-btn {
  height: 36px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 0.9rem;
  cursor: pointer;
  white-space: nowrap;
}
.tb-btn:hover { color: var(--text); border-color: var(--muted); }
.tb-btn kbd {
  font-family: var(--mono);
  font-size: 0.75rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0 4px;
  margin-left: 6px;
}
.menu-btn { display: none; }

/* ---------- Layout ---------- */
.shell { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - var(--header-h)); }
.sidebar {
  position: sticky;
  top: var(--header-h);
  align-self: start;
  height: calc(100vh - var(--header-h));
  overflow-y: auto;
  padding: 22px 16px 40px;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
}
.nav-section { margin-bottom: 18px; }
.nav-title {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 8px 8px;
}
.nav-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: 7px;
  color: var(--text);
  text-decoration: none;
  font-size: 0.92rem;
  line-height: 1.35;
}
.nav-link:hover { background: var(--surface); color: var(--text); }
.nav-link.active { background: var(--surface); color: var(--accent-text); font-weight: 600; box-shadow: var(--shadow); }
.nav-link .tick {
  width: 16px; height: 16px; flex: 0 0 16px; border-radius: 50%;
  border: 1px solid var(--border); display: grid; place-items: center;
  font-size: 10px; color: transparent;
}
.nav-link.done .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
.nav-link .n { color: var(--muted); font-family: var(--mono); font-size: 0.75rem; width: 22px; flex: 0 0 22px; }
.chapter-label { font-size: 0.82rem; color: var(--muted); margin: 14px 8px 4px; font-weight: 600; }

.main { min-width: 0; padding: 48px 56px 96px; }
.page { max-width: 760px; margin: 0 auto; }
.page.wide { max-width: 900px; }
.page-enter { animation: fadeIn 0.25s ease both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ---------- Page elements ---------- */
.crumb { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.crumb .sep { opacity: 0.5; }
.lead { font-size: 1.14rem; color: var(--muted); line-height: 1.65; margin-bottom: 1.6em; }
.meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.88rem; color: var(--muted); margin-bottom: 28px; }
.meta span + span::before { content: "·"; margin-right: 16px; opacity: 0.6; }

.figure {
  margin: 28px 0 34px;
  padding: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.figure figcaption { font-size: 0.85rem; color: var(--muted); margin-top: 14px; text-align: center; }

.callout {
  margin: 26px 0;
  padding: 16px 20px;
  border-radius: 10px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  background: var(--surface);
}
.callout strong { display: block; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 4px; }
.callout p:last-child { margin-bottom: 0; }
.callout.warn { border-left-color: var(--warn); }
.callout.warn strong { color: var(--warn); }

.example {
  margin: 30px 0;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--surface);
}
.example-head {
  padding: 12px 20px;
  background: var(--accent-soft);
  color: var(--accent-text);
  font-size: 0.8rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.example-body { padding: 20px; }
.example-body > :last-child { margin-bottom: 0; }

.codeblock { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin: 18px 0; background: var(--code-bg); }
.codeblock-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 14px; border-bottom: 1px solid var(--border);
  font-size: 0.78rem; color: var(--muted); font-family: var(--mono);
}
.copy-btn {
  background: transparent; border: 1px solid var(--border); border-radius: 6px;
  padding: 2px 9px; font-size: 0.75rem; cursor: pointer; color: var(--muted);
}
.copy-btn:hover { color: var(--text); border-color: var(--muted); }
pre { margin: 0; padding: 16px 18px; overflow-x: auto; }
pre code { font-family: var(--mono); font-size: 0.86rem; line-height: 1.6; color: var(--code-text); white-space: pre; }
code { font-family: var(--mono); font-size: 0.88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; color: var(--code-text); }

table { width: 100%; border-collapse: collapse; font-size: 0.93rem; margin: 18px 0; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; }

.keypoints { margin: 30px 0; }
.keypoints ul { margin: 0; padding-left: 20px; }
.keypoints li { margin-bottom: 6px; }

.task {
  margin: 30px 0;
  padding: 18px 22px;
  border-radius: 10px;
  background: var(--warn-soft);
  border: 1px solid var(--border);
}
.task h3 { margin: 0 0 6px; color: var(--warn); font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; }
.task p:last-child { margin: 0; }

.quiz {
  margin: 34px 0 30px;
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
}
.quiz h3 { margin: 0 0 8px; color: var(--accent-text); font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; }
.quiz-q { font-family: var(--serif); font-size: 1.12rem; font-weight: 600; margin: 0 0 14px; }
.quiz-opts { display: grid; gap: 8px; }
.opt {
  text-align: left; padding: 11px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-size: 0.95rem;
}
.opt:hover { border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
.quiz-fb { margin: 14px 0 0; min-height: 1.4em; color: var(--muted); font-size: 0.93rem; }

.complete-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 10px 0 34px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  font-size: 0.93rem; font-weight: 600; cursor: pointer; text-decoration: none;
}
.btn:hover { border-color: var(--muted); color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { color: #fff; filter: brightness(1.06); }
.btn.done { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, var(--border)); }

.pager {
  display: flex; justify-content: space-between; gap: 16px; padding-top: 22px;
  border-top: 1px solid var(--border); font-size: 0.95rem;
}
.pager a { text-decoration: none; max-width: 48%; color: var(--accent-text); }
.pager a:hover { text-decoration: underline; }

/* ---------- Home ---------- */
.overview-table td:first-child { font-weight: 600; white-space: nowrap; }
.progress-box {
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  padding: 18px 22px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); margin: 26px 0;
}
.progress-track { flex: 1; min-width: 200px; height: 8px; border-radius: 999px; background: var(--code-bg); overflow: hidden; }
.progress-track i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.5s ease; }

/* ---------- Labs ---------- */
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--sidebar); border: 1px solid var(--border); border-radius: 10px; margin: 22px 0; width: fit-content; max-width: 100%; }
.seg a {
  padding: 7px 14px; border-radius: 7px; font-size: 0.9rem; color: var(--muted); text-decoration: none;
}
.seg a.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
.lab-panel { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); padding: 26px; }
.lab-panel h2 { margin-top: 0; font-size: 1.3rem; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 18px 0; }
.controls label { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.92rem; }
.controls .grow { flex: 1; min-width: 200px; }
.controls input[type="range"] { width: 100%; accent-color: var(--accent); }
.controls input[type="text"], .controls select, .search {
  background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 12px; font: inherit; font-size: 0.92rem;
}
.search { width: 100%; margin: 20px 0 8px; }
.stage-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 18px 0; }
.stage { padding: 12px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); text-align: center; transition: border-color 0.3s, background 0.3s; }
.stage b { display: block; font-size: 0.85rem; font-weight: 600; }
.stage small { display: block; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
.stage.running { border-color: var(--accent); }
.stage.pass { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--bg)); }
.stage.fail { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--bg)); }
.stage.skipped { opacity: 0.5; }
@media (max-width: 720px) { .stage-row { grid-template-columns: repeat(3, 1fr); } }
.log { list-style: none; padding: 0; margin: 14px 0 0; font-family: var(--mono); font-size: 0.84rem; max-height: 200px; overflow: auto; }
.log li { padding: 5px 10px; border-left: 2px solid var(--border); margin-bottom: 3px; color: var(--muted); }
.log li.ok { color: var(--ok); border-color: var(--ok); }
.log li.bad { color: var(--bad); border-color: var(--bad); }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
.cmp { padding: 18px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); }
.cmp h3 { margin: 0 0 4px; font-size: 0.98rem; }
.cmp .big { font-family: var(--serif); font-size: 1.9rem; font-weight: 600; margin: 4px 0; }
.cmp p { margin: 0; font-size: 0.88rem; color: var(--muted); }
@media (max-width: 720px) { .compare { grid-template-columns: 1fr; } }
.hist { height: 200px; display: flex; align-items: flex-end; gap: 4px; padding-top: 12px; border-bottom: 1px solid var(--border); }
.hbar { flex: 1; background: var(--accent); opacity: 0.75; border-radius: 3px 3px 0 0; min-height: 2px; transition: height 0.4s ease; }
.stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 16px; }
.metric { padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); text-align: center; }
.metric b { display: block; font-size: 1.15rem; font-family: var(--serif); }
.metric span { font-size: 0.78rem; color: var(--muted); }
.metric.ok b { color: var(--ok); }
.metric.bad b { color: var(--bad); }
@media (max-width: 720px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }
.risk-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.rmatrix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.rcell { aspect-ratio: 1.3; border-radius: 8px; display: grid; place-items: center; font-weight: 600; font-size: 1.05rem; }
.rcell.low { background: color-mix(in srgb, var(--ok) 16%, var(--bg)); color: var(--ok); }
.rcell.med { background: color-mix(in srgb, var(--warn) 18%, var(--bg)); color: var(--warn); }
.rcell.high { background: color-mix(in srgb, var(--bad) 18%, var(--bg)); color: var(--bad); }
.rlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; max-height: 300px; overflow: auto; }
.rlist li { padding: 10px 12px; border-radius: 8px; background: var(--bg); border-left: 3px solid var(--border); font-size: 0.9rem; }
.rlist li span { display: block; color: var(--muted); font-size: 0.82rem; }
.rlist li.high { border-left-color: var(--bad); }
.rlist li.med { border-left-color: var(--warn); }
.rlist li.low { border-left-color: var(--ok); }
@media (max-width: 720px) { .risk-wrap { grid-template-columns: 1fr; } }

/* ---------- Glossary ---------- */
.gloss { margin: 0; }
.gl-item { padding: 14px 0; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 220px 1fr; gap: 18px; }
.gl-item dt { font-weight: 600; }
.gl-item dd { margin: 0; color: var(--muted); }
@media (max-width: 640px) { .gl-item { grid-template-columns: 1fr; gap: 4px; } }

/* ---------- Visuals (calm, professional) ---------- */
.vis { width: 100%; height: auto; max-width: 680px; margin: 0 auto; }
.vis text { font-family: var(--sans); }
.vis .box { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
.vis .box.accent { stroke: var(--accent); }
.vis .label { fill: var(--text); font-size: 13px; font-weight: 600; text-anchor: middle; }
.vis .sub { fill: var(--muted); font-size: 11px; text-anchor: middle; }
.vis .line { stroke: var(--border); stroke-width: 1.8; fill: none; }
.vis .flow { stroke: var(--accent); stroke-width: 1.8; fill: none; stroke-dasharray: 5 5; }
.vis .dot { fill: var(--accent); }
.vis .dot2 { fill: var(--muted); }
.vis .hl { fill: var(--accent-soft); stroke: var(--accent); }
.vis .step { animation: stepOn 8s infinite; animation-delay: calc(var(--i) * 1s); }
@keyframes stepOn { 0%, 100% { opacity: 0.45; } 6%, 16% { opacity: 1; } 24% { opacity: 0.45; } }
.vis .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 6s ease-in-out infinite; }
.vis .draw.b { animation-delay: 1.2s; }
@keyframes draw { 0%, 10% { stroke-dashoffset: 900; } 45%, 100% { stroke-dashoffset: 0; } }
.vis .pulse { animation: pulseOp 3s ease-in-out infinite; }
@keyframes pulseOp { 50% { opacity: 0.35; } }

.bars { display: grid; gap: 14px; }
.bar-row { display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: center; font-size: 0.9rem; }
.track { height: 14px; background: var(--code-bg); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
.fill { height: 100%; width: 0; border-radius: 999px; }
.fill.sleep { background: var(--bad); animation: grow-sleep 6s ease-in-out infinite; }
.fill.cond { background: var(--ok); animation: grow-cond 6s ease-in-out infinite; }
@keyframes grow-sleep { 0% { width: 0; } 70%, 100% { width: 100%; } }
@keyframes grow-cond { 0% { width: 0; } 25%, 100% { width: 34%; } }
@media (max-width: 560px) { .bar-row { grid-template-columns: 1fr; gap: 6px; } }

.pipe { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.pipe .st { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 0.86rem; font-weight: 600; animation: stageOn 7s infinite; animation-delay: calc(var(--i) * 0.7s); }
.pipe .arr { color: var(--muted); }
@keyframes stageOn { 0%, 60%, 100% { border-color: var(--border); } 8%, 45% { border-color: var(--ok); color: var(--ok); } }

.layers-stack { display: grid; gap: 6px; max-width: 420px; margin: 0 auto; }
.layers-stack .lay { padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 0.92rem; font-weight: 600; text-align: center; animation: stepOn 9s infinite; animation-delay: calc(var(--i) * 0.9s); }
.layers-stack .down { text-align: center; color: var(--muted); font-size: 0.8rem; }

.rca-stack { display: grid; gap: 8px; max-width: 520px; margin: 0 auto; }
.rca-stack .why { padding: 11px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 0.9rem; animation: rcaIn 8s infinite; animation-delay: calc(var(--i) * 0.8s); opacity: 0; }
.rca-stack .why.root { border-color: var(--bad); }
@keyframes rcaIn { 0% { opacity: 0; } 10%, 80% { opacity: 1; } 92%, 100% { opacity: 0; } }

.cache-note { font-size: 0.85rem; color: var(--muted); text-align: center; margin-top: 8px; }

/* ---------- Mobile ---------- */
.scrim { display: none; }
@media (max-width: 960px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; top: var(--header-h); left: 0; bottom: 0; width: 290px; max-width: 86vw; height: auto;
    transform: translateX(-100%); transition: transform 0.25s ease; z-index: 30; box-shadow: var(--shadow);
  }
  .sidebar.open { transform: none; }
  .scrim.open { display: block; position: fixed; inset: var(--header-h) 0 0 0; background: rgba(0,0,0,0.25); z-index: 25; }
  .menu-btn { display: inline-flex; }
  .main { padding: 32px 22px 80px; }
  h1 { font-size: 1.85rem; }
  .tb-btn .label-long { display: none; }
}
@media (max-width: 520px) {
  .brand-name span { display: none; }
  .tb-btn kbd { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Search dialog ---------- */
.palette { position: fixed; inset: 0; z-index: 60; background: rgba(15, 18, 22, 0.42); display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; }
.palette.hidden { display: none; }
.palette-box { width: min(560px, 92vw); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); overflow: hidden; }
#paletteInput { width: 100%; border: 0; border-bottom: 1px solid var(--border); background: transparent; color: var(--text); font: inherit; font-size: 1rem; padding: 16px 18px; outline: none; }
#paletteList { list-style: none; margin: 0; padding: 6px; max-height: 360px; overflow: auto; }
#paletteList li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 7px; cursor: pointer; font-size: 0.93rem; }
#paletteList li small { color: var(--muted); }
#paletteList li.act { background: var(--accent-soft); color: var(--accent-text); }

/* ---------- Database scan diagram ---------- */
.scan { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; max-width: 460px; margin: 0 auto; font-family: var(--mono); font-size: 0.86rem; background: var(--bg); }
.scan-row { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 9px 14px; border-bottom: 1px solid var(--border); }
.scan-row:last-child { border-bottom: 0; }
.scan-row.head { color: var(--muted); font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.05em; background: var(--surface); }

<script>
/* ==========================================================================
   ROBBERCAT's Journey: course content
   Each lesson has: sections (explanation), an example (worked, with explanation),
   key points, a practice task and a quick check.
   ========================================================================== */
window.COURSE = {

  chapters: [
    { id: 'foundations', title: 'Foundations', blurb: 'How software is built, tested and recorded.' },
    { id: 'programming', title: 'Programming', blurb: 'Python and TypeScript, from first lines to a working test.' },
    { id: 'automation', title: 'Automation and APIs', blurb: 'Driving browsers and APIs reliably.' },
    { id: 'framework', title: 'Framework design', blurb: 'Structuring automation so it survives growth.' },
    { id: 'reliability', title: 'Reliability and CI/CD', blurb: 'Stable tests and pipelines that give honest feedback.' },
    { id: 'system', title: 'System design', blurb: 'How systems are shaped, and what that means for testers.' },
    { id: 'quality', title: 'Quality operations', blurb: 'Data, performance, root-cause analysis and risk.' }
  ],

  topics: [

    /* ============================ FOUNDATIONS ============================ */
    {
      id: 'testing-fundamentals', chapter: 'foundations', title: 'Testing fundamentals', time: '25 min', visual: 'lifecycle',
      summary: 'The thinking that comes before any tool: why we test, how software is delivered, how to design good test cases and how to report defects clearly.',
      sections: [
        { h: 'Why testing exists', p: [
          'Software fails in ways users remember, and those failures are expensive: lost customers, refunds, emergency fixes and damaged trust. Testing reduces that risk by checking that the system behaves as the requirements describe, and by giving the team fast information whenever something changes.',
          'The output of a tester is information, not a verdict. A good tester answers three questions for the team: what works, what does not, and how confident we can be. Every test should exist because it answers a question somebody actually cares about.'
        ]},
        { h: 'SDLC and STLC', p: [
          'The Software Development Life Cycle (SDLC) is the path a product takes from idea to release: requirements, design, development, testing, deployment and maintenance. Different models arrange these differently. Waterfall completes each phase before starting the next. Agile repeats the cycle in short iterations and tests continuously. The V-Model pairs each development phase with a matching test phase, such as acceptance tests for requirements.',
          'The Software Testing Life Cycle (STLC) is the testing track inside that process. It usually covers requirement analysis, test planning, test case design, environment setup, test execution and test closure. Each phase has entry and exit criteria, which tell you when you may begin it and when it is finished.'
        ]},
        { h: 'Test design techniques', p: [
          'Exhaustive testing is impossible for almost every real input, so testers use techniques to choose a small, effective set of cases. Equivalence partitioning groups inputs that should behave the same and tests one value from each group. Boundary value analysis tests the edges of those groups, because off-by-one defects cluster there. Decision tables cover combinations of conditions, and state transition testing covers workflows, such as an order moving from placed to paid to shipped.'
        ]},
        { h: 'Reporting defects', p: [
          'A defect report is useful only if someone else can reproduce the problem. It needs a clear title, the environment and build, numbered steps, the expected result, the actual result, and evidence such as a screenshot or log excerpt. Severity describes the technical impact on the system. Priority describes how soon the business wants it fixed. A misspelled word on the home page may be low severity but high priority, so keep the two fields separate when you triage.'
        ]}
      ],
      example: {
        title: 'Worked example: test cases for a password field',
        text: 'The requirement says a password must be between 8 and 64 characters. Applying boundary value analysis gives the cases below. Each row targets one boundary, so a single failing row points directly at the defect.',
        table: {
          head: ['Case', 'Input length', 'Expected result', 'Why it matters'],
          rows: [
            ['TC-01', '7 characters', 'Rejected with a clear message', 'Just below the minimum'],
            ['TC-02', '8 characters', 'Accepted', 'Exactly the minimum'],
            ['TC-03', '64 characters', 'Accepted', 'Exactly the maximum'],
            ['TC-04', '65 characters', 'Rejected', 'Just above the maximum'],
            ['TC-05', '0 characters', 'Rejected, required-field message', 'Empty input']
          ]
        },
        after: 'Five cases cover the whole range. Without boundary analysis a tester might only try a typical 12-character password, which passes even when the boundary check is missing entirely.'
      },
      keypoints: [
        'Every test case should trace back to a requirement or an identified risk.',
        'Boundary values are a high-yield source of defects.',
        'Severity describes impact; priority describes urgency. Record both.',
        'A short, reproducible defect report is worth more than a long vague one.'
      ],
      task: 'Choose a form you use often. Write five test cases for one field using equivalence partitioning and boundary values, with expected results.',
      quiz: {
        q: 'A password field accepts 8 to 64 characters. Which input is a boundary test?',
        o: ['A 30-character password', 'A 7-character password', 'A password containing symbols', 'An empty field named pass'],
        a: 1,
        e: '7 characters sits just below the minimum. Boundary tests also include 8, 64 and 65 characters.'
      }
    },

    {
      id: 'git', chapter: 'foundations', title: 'Git and collaboration', time: '20 min', visual: 'branch',
      summary: 'Your automation code lives in a repository. Git records every change, lets teammates review it, and lets pipelines run it on each push.',
      sections: [
        { h: 'Commits, branches and pull requests', p: [
          'A commit is a saved snapshot of your files together with a message that explains why the change exists. Messages are for people, so write them in the imperative mood and keep them specific, such as "Add retry to login helper" rather than "fixes".',
          'A branch is a parallel line of work. You create a branch for each change, so work in progress never disturbs main. When the change is ready, you push the branch and open a pull request. A pull request is the review step: teammates read the diff, leave comments, and approve before the change is merged.'
        ]},
        { h: 'Merge and rebase', p: [
          'Merge joins two histories and records the point where they came together. Rebase replays your commits on top of the latest main, which produces a straight, readable history. A practical rule is to rebase your own unshared branch to stay current with main, and never rewrite history that other people have already pulled.'
        ]},
        { h: 'Conflicts and secrets', p: [
          'A conflict happens when two branches change the same lines. Git marks the conflicting section in the file. Decide the correct content, remove the markers, and commit. If you are unsure which version is right, ask the author of the other change.',
          'Never commit credentials, even briefly. Git keeps history, so a password committed and then deleted is still recoverable. Store secrets in environment variables or a secrets manager, and list local files such as .env in .gitignore.'
        ]}
      ],
      example: {
        title: 'Worked example: a feature branch from start to merge',
        text: 'The sequence below adds one test on its own branch, reviews it through a pull request and returns main to the latest state.',
        code: { lang: 'bash', code: '# 1. Start from an up-to-date main and create a branch\ngit checkout main\ngit pull\ngit checkout -b feature/login-smoke-test\n\n# 2. Make a focused change and commit it\ngit add tests/login.spec.ts\ngit commit -m "Add smoke test for valid login"\n\n# 3. Share the branch and open a pull request on GitHub\ngit push -u origin feature/login-smoke-test\n\n# 4. After approval, merge on GitHub, then clean up locally\ngit checkout main\ngit pull\ngit branch -d feature/login-smoke-test' },
        after: 'Each step has a purpose. Pulling main first means your branch starts from the latest code, which reduces conflicts. The commit message describes the behavior added. Deleting the branch after merge keeps the repository tidy, and the history on main still records the change.'
      },
      keypoints: [
        'Commit small, focused changes with messages that explain why.',
        'One branch per change, reviewed through a pull request.',
        'Rebase your own unshared work; do not rewrite shared history.',
        'Never commit credentials, even temporarily.'
      ],
      task: 'Create a practice repository. Make three commits on a branch called feature/first-test, open a pull request, and merge it after review.',
      quiz: {
        q: 'What is the main purpose of a pull request?',
        o: ['To delete old branches', 'To have changes reviewed before they are merged', 'To run the database', 'To create a new repository'],
        a: 1,
        e: 'A pull request is the review checkpoint. It lets teammates catch problems before the change reaches main.'
      }
    },

    /* ============================ PROGRAMMING ============================ */
    {
      id: 'python', chapter: 'programming', title: 'Python for test automation', time: '40 min', visual: null,
      summary: 'Python reads close to plain English, which makes it a gentle first language. The core ideas here are enough to write, run and understand real tests.',
      sections: [
        { h: 'Why Python', p: [
          'Python is widely used in test automation. pytest runs tests and reports results, Playwright and Selenium drive browsers, and requests calls HTTP APIs. The same few ideas appear in all of them: values, collections, functions, classes and assertions. Learning those ideas once pays off across every library.'
        ]},
        { h: 'Values, collections and functions', p: [
          'A variable holds a value. Python detects the type automatically, but you can still see it with type(). A list is an ordered collection, written with square brackets. A dictionary maps keys to values, written with curly braces, which suits data such as a user record with a role and an email.',
          'A function packages a piece of logic under a name and returns a result. Functions are the main way to avoid repeating yourself. Python uses indentation, four spaces per level, to define blocks, so keep the indentation consistent.'
        ]},
        { h: 'Classes and modules', p: [
          'A class groups related data and behavior. A LoginPage class, for example, can hold the locators for the login form and the actions a user performs on it. A module is a single Python file you can import from elsewhere, and a package is a folder of modules. These are the building blocks of a framework.'
        ]},
        { h: 'Tests with pytest', p: [
          'pytest discovers files named test_*.py and functions named test_*. Inside a test, an assert statement states what must be true. When an assertion fails, pytest shows the values it compared, which is usually enough to start an investigation. Use a virtual environment for each project so its packages do not conflict with others.'
        ]}
      ],
      example: {
        title: 'Worked example: a function and its tests',
        text: 'The function calculates the percentage of passing results. The tests check a normal case and an edge case that would otherwise cause a division-by-zero error.',
        code: { lang: 'python', code: '# pass_rate.py\ndef pass_rate(results):\n    """Return the percentage of True values in a list of booleans."""\n    if not results:\n        return 0.0\n    return round(sum(results) / len(results) * 100, 1)\n\n\n# test_pass_rate.py\nfrom pass_rate import pass_rate\n\ndef test_mixed_results():\n    assert pass_rate([True, True, False, True]) == 75.0\n\ndef test_empty_list_does_not_crash():\n    assert pass_rate([]) == 0.0' },
        after: 'Run pytest -v and you will see both tests pass. The empty-list test matters because without the guard, len(results) would be zero and Python would raise an error. Testing edge cases such as empty input is one of the most common ways a beginner adds real value early.'
      },
      keypoints: [
        'Indentation is part of Python syntax.',
        'Use one virtual environment per project.',
        'pytest finds test_*.py files and test_* functions.',
        'Every test is built from assertions; each assertion states an expectation.'
      ],
      task: 'Write a function that counts how many values in a list are negative. Write three pytest tests: a normal list, an empty list, and a list with only positive numbers.',
      quiz: {
        q: 'Which naming pattern does pytest use to discover test functions?',
        o: ['check_*', 'test_*', 'spec_*', 'verify_*'],
        a: 1,
        e: 'pytest looks for functions whose names start with test_ inside files named test_*.py.'
      }
    },

    {
      id: 'typescript', chapter: 'programming', title: 'TypeScript for test automation', time: '40 min', visual: null,
      summary: 'TypeScript adds types to JavaScript. Types catch many mistakes before a test runs, which is why it is the standard language for modern Playwright projects.',
      sections: [
        { h: 'Why types help', p: [
          'A type describes what a value is: a string, a number, a boolean or an object with a known shape. If a function expects a number and receives a string, TypeScript reports the problem in the editor, as you type. Without types, the same mistake may only appear as a failed test in a pipeline hours later.',
          'TypeScript is the default for modern web automation and for many front-end teams, so the skills carry over to the applications you will test.'
        ]},
        { h: 'Interfaces and union types', p: [
          'An interface describes the shape of an object. For example, a User interface can require a role and an email. A union type limits a value to a list of options, such as "admin" | "viewer". Together they document the data your tests use, and they let the editor warn you about a misspelled field name.'
        ]},
        { h: 'Async code and await', p: [
          'Browser and network operations take time. An async function returns a promise, a value that will be available later, and await pauses execution until that value is ready. Almost every Playwright action is asynchronous, so await appears constantly. Forgetting it is the most common beginner error, and TypeScript usually flags it.'
        ]},
        { h: 'Playwright tests', p: [
          'Create a project with npm init playwright@latest. Each test receives fixtures such as page (a browser tab) and request (an HTTP client). Tests use test() to declare a scenario and expect() to state what must be true.'
        ]}
      ],
      example: {
        title: 'Worked example: a typed API response and a check',
        text: 'The code defines the shape of a response, calls an endpoint and checks the status and one field. The types document what the test expects.',
        code: { lang: 'typescript', code: "import { test, expect } from '@playwright/test';\n\ninterface UserResponse {\n  id: number;\n  name: string;\n  role: 'admin' | 'viewer';\n}\n\ntest('fetch user 1 returns the expected shape', async ({ request }) => {\n  const res = await request.get('https://jsonplaceholder.typicode.com/users/1');\n  expect(res.status()).toBe(200);\n\n  const body = (await res.json()) as UserResponse;\n  expect(body.id).toBe(1);\n  expect(typeof body.name).toBe('string');\n});" },
        after: 'The await before request.get waits for the network. The await before res.json() waits for the body to be read. If you removed the first await, res would be a promise and res.status() would fail. The interface does not change what runs; it tells you and the editor what the data should look like.'
      },
      keypoints: [
        'Forgetting await is the most common beginner bug.',
        'Prefer const; use let only when a value must change.',
        'Interfaces and union types document the data your tests rely on.',
        'expect() is how a test states what must be true.'
      ],
      task: 'Write a typed function passRate(passed: number, total: number): number. Then create a Playwright test that opens a page and asserts that its main heading is visible.',
      quiz: {
        q: 'What does await do in TypeScript?',
        o: ['Runs code in parallel forever', 'Pauses until a promise resolves, then gives its value', 'Declares a variable', 'Deletes a failed test'],
        a: 1,
        e: 'await pauses the function until the promise finishes and then gives you the result. Without it you hold a promise, not the value.'
      }
    },

    /* ============================ AUTOMATION ============================ */
    {
      id: 'ui-automation', chapter: 'automation', title: 'UI automation with Playwright and Selenium', time: '35 min', visual: 'flow',
      summary: 'UI automation drives the interface the way a user does. Good locators and proper waiting separate a reliable test from a fragile one.',
      sections: [
        { h: 'Choosing a tool', p: [
          'Playwright controls Chromium, Firefox and WebKit, waits automatically for elements to become ready, and provides tracing and parallel execution. Selenium is the long-established standard with bindings for many languages. Appium applies similar ideas to native mobile apps. Learn one tool well first; locators, waits and assertions transfer to the others.'
        ]},
        { h: 'Locators', p: [
          'A locator tells the tool which element to act on. The most stable locators describe what a user perceives: the role of a control, its accessible label, its visible text, or a dedicated test ID that developers add for testing. Long absolute XPath expressions copied from a browser tend to break whenever the layout changes.'
        ]},
        { h: 'Waiting and asserting', p: [
          'Modern tools wait for an element to be visible and enabled before acting on it. You still need to state the expected outcome, using an assertion such as expect(...).toBeVisible(). The assertion is retried until it passes or times out, which is far more reliable than a fixed sleep.'
        ]},
        { h: 'Page objects', p: [
          'A page object is a class that holds the locators and actions for one page of the application. Tests then read like a description of user behavior. When a locator changes, you update one file instead of every test that touches that page.'
        ]}
      ],
      example: {
        title: 'Worked example: comparing locator strategies',
        text: 'The same button can be found in several ways. The table ranks common options by how well they survive normal change to the page.',
        table: {
          head: ['Locator', 'Example', 'Survives redesign?', 'Comment'],
          rows: [
            ['Role and name', "getByRole('button', { name: 'Login' })", 'Yes', 'Describes meaning; preferred'],
            ['Label', "getByLabel('Password')", 'Yes', 'Good for form fields'],
            ['Test ID', "getByTestId('login-btn')", 'Yes', 'Explicit contract with developers'],
            ['CSS class', "locator('.btn-primary-v2')", 'Often no', 'Classes change with styling'],
            ['Absolute XPath', "locator('/html/body/div[3]/button')", 'No', 'Breaks on any layout change']
          ]
        },
        code: { lang: 'typescript', code: "import { test, expect } from '@playwright/test';\n\ntest('valid login opens the dashboard', async ({ page }) => {\n  await page.goto('/login');\n  await page.getByLabel('Username').fill('admin@example.com');\n  await page.getByLabel('Password').fill('correct-password');\n  await page.getByRole('button', { name: 'Login' }).click();\n  await expect(page.getByRole('heading', { name: 'Dashboard' })).toBeVisible();\n});" },
        after: 'The test describes user actions and one outcome. It never says how long to wait, because the framework retries each step until the element is ready. If the Login button is restyled, this test keeps working, which is the property you want from a locator.'
      },
      keypoints: [
        'Prefer role, label and test-ID locators.',
        'Assert outcomes with expect() instead of sleeping for a fixed time.',
        'One page, one class.',
        'Keep each test independent of the others.'
      ],
      task: 'Automate the login page of a public demo site. Use only role or label locators, and end with one assertion on a visible element.',
      quiz: {
        q: 'Which locator is generally the most stable?',
        o: ['An absolute XPath from the document root', 'A role or test ID that describes meaning', 'The element\u2019s position on screen', 'A CSS class generated by a build tool'],
        a: 1,
        e: 'Roles and test IDs describe what an element is for, so they survive visual and structural change.'
      }
    },

    {
      id: 'api-testing', chapter: 'automation', title: 'API testing: REST, methods and status codes', time: '35 min', visual: 'request',
      summary: 'APIs are where business rules meet the network. Testing them directly is faster and more precise than testing the same rules through the interface.',
      sections: [
        { h: 'REST in brief', p: [
          'A REST API exposes resources at URLs such as /users/42. You act on those resources with HTTP methods. GET reads a resource, POST creates one, PUT replaces it, PATCH changes part of it, and DELETE removes it. GET and PUT are idempotent: sending the same request twice has the same effect as sending it once. That property matters when a client retries after a timeout.'
        ]},
        { h: 'Status codes', p: [
          'The response status code summarizes the outcome. The 2xx range means success: 200 OK, 201 Created, 204 No Content. The 3xx range means redirection. The 4xx range means the request was wrong: 400 for malformed input, 401 when authentication is missing, 403 when the user lacks permission, 404 when the resource does not exist, 409 for a conflict, and 422 when the input fails validation. The 5xx range means the server failed: 500, 502 and 503.',
          'Assert the exact code. Checking only that the response is not an error hides real problems, such as a 201 where you expected a 200.'
        ]},
        { h: 'What to check', p: [
          'For each call, check the status code, the content type, the shape of the body and the key values. For negative cases, check that the request is rejected with the right code and a message that explains the problem without leaking internal details.'
        ]},
        { h: 'Tools', p: [
          'Postman lets you explore an API and save collections of requests with environment variables, such as a base URL that changes between test and production. Newman runs those collections from the command line in a pipeline. In code, the Playwright request fixture, Python requests and RestAssured perform the same checks.'
        ]}
      ],
      example: {
        title: 'Worked example: expected results for a user endpoint',
        text: 'The table lists the requests a team would check for a simple user resource, with the status code each one should return and the reason.',
        table: {
          head: ['Request', 'Expected status', 'What it proves'],
          rows: [
            ['GET /users/1', '200', 'An existing user is returned'],
            ['GET /users/999999', '404', 'Unknown resources are reported correctly'],
            ['POST /users with a valid body', '201', 'Creation succeeds and reports it'],
            ['POST /users with no email', '400 or 422', 'Invalid input is rejected'],
            ['GET /users/1 without a token', '401', 'Protected data requires authentication']
          ]
        },
        code: { lang: 'typescript', code: "import { test, expect } from '@playwright/test';\n\ntest('creating a user returns 201 and the new record', async ({ request }) => {\n  const res = await request.post('/api/users', { data: { name: 'Ada', email: 'ada@example.com' } });\n  expect(res.status()).toBe(201);\n  const body = await res.json();\n  expect(body.name).toBe('Ada');\n  expect(body.id).toBeDefined();\n});" },
        after: 'Each row in the table becomes one test. Notice that the negative cases carry as much weight as the success case. Most production bugs in APIs appear when the input is wrong, empty or unexpected.'
      },
      keypoints: [
        'Assert exact status codes, not just "not an error".',
        'Test negative cases: invalid input, missing authentication, unknown resources.',
        'Never hard-code tokens or base URLs; read them from configuration.',
        'Check structure and values separately: schema for shape, explicit assertions for values.'
      ],
      task: 'Using a public test API, write tests for one GET that returns data, one POST that creates data, and one GET for a missing resource that must return 404.',
      quiz: {
        q: 'An API returns 404. What does that most likely mean?',
        o: ['The server crashed', 'The requested resource was not found', 'Authentication failed', 'The response came from a cache'],
        a: 1,
        e: '404 Not Found means the server cannot find the resource at that address. A crash would produce a 5xx code.'
      }
    },

    /* ============================ FRAMEWORK ============================ */
    {
      id: 'framework-patterns', chapter: 'framework', title: 'Framework architecture and design patterns', time: '45 min', visual: 'layers',
      summary: 'A framework that grows without structure becomes one large file that nobody wants to touch. Layers and a few well-known patterns keep it understandable as it scales.',
      sections: [
        { h: 'Why structure matters', p: [
          'Without structure, a framework turns into a God class: one file that handles login, test data, reporting and browser creation. Such files are hard to change safely because everything depends on everything else. Layers separate those concerns so that each part changes for one reason.',
          'A useful rule: tests describe what is verified, and the framework decides how the browser or API is driven. A test that contains selectors or URLs is coupled to the implementation, and it will break when the implementation changes.'
        ]},
        { h: 'The layers', p: [
          'Tests describe scenarios. Facades combine page actions into business flows, such as loginAs(role). Strategies handle variations, such as password login versus single sign-on, selected by configuration. Page objects own locators and UI actions. Repositories provide test data. Drivers and configuration create browsers and environments.',
          'Each layer may depend only on the layers below it. That keeps dependencies one-directional, so a change in a page object cannot ripple upward into the tests.'
        ]},
        { h: 'Key patterns', p: [
          'A factory creates browsers or API clients, so tests ask for one and never need to know its details. A singleton holds one shared configuration object, which is convenient but can hide shared state, so use it with care. A builder assembles complex request bodies step by step. A strategy swaps one behavior for another at runtime. An observer reacts to events, such as a failed test triggering a screenshot.',
          'Dependency injection passes collaborators into a class through its constructor instead of creating them inside. This single habit makes code testable, because you can supply a fake when a real dependency is slow or unavailable.'
        ]},
        { h: 'Test data', p: [
          'Keep data out of test logic. Create data through the API where you can, give each test unique values, and clean up afterwards. Data can come from JSON files, spreadsheets, a database or an API. The repository hides that choice, so tests ask for "an admin user" and do not care where it came from.'
        ]}
      ],
      example: {
        title: 'Worked example: a layered login flow',
        text: 'The test contains no selectors and no URLs. The facade hides the sequence of steps, and the page object is the only place that knows the form.',
        code: { lang: 'typescript', code: "// pages/LoginPage.ts : knows the screen, nothing else\nexport class LoginPage {\n  constructor(private page: Page) {}\n  async open() { await this.page.goto('/login'); }\n  async submit(user: string, pass: string) {\n    await this.page.getByLabel('Username').fill(user);\n    await this.page.getByLabel('Password').fill(pass);\n    await this.page.getByRole('button', { name: 'Login' }).click();\n  }\n}\n\n// facades/LoginFacade.ts : knows the business step\nexport class LoginFacade {\n  constructor(private login: LoginPage, private data: UserRepository) {}\n  async loginAs(role: string) {\n    const user = this.data.getByRole(role);   // data layer\n    await this.login.open();\n    await this.login.submit(user.username, user.password);\n  }\n}\n\n// tests/login.spec.ts : describes the scenario only\ntest('admin reaches the dashboard', async ({ page }) => {\n  await new LoginFacade(new LoginPage(page), new UserRepository()).loginAs('admin');\n  await expect(page.getByRole('heading', { name: 'Dashboard' })).toBeVisible();\n});" },
        after: 'If the login form moves to a different URL, only LoginPage changes. If a second login method is added, a new strategy is created and the facade chooses it. The test continues to read as a single business statement, which is what makes a large suite maintainable.'
      },
      keypoints: [
        'Tests contain no selectors and no hard-coded URLs.',
        'Each concern lives in one place.',
        'Inject dependencies rather than creating them inside classes.',
        'Unique test data per run keeps parallel execution safe.'
      ],
      task: 'Take one test that clicks through login and refactor it into a LoginPage class and a LoginFacade with a loginAs() method. The test should shrink to a few lines.',
      quiz: {
        q: 'Which pattern lets you change the browser without changing your tests?',
        o: ['Singleton', 'Factory', 'Builder', 'Observer'],
        a: 1,
        e: 'A factory centralizes object creation, so tests request a browser and never depend on which one they receive.'
      }
    },

      id: 'anti-flakiness', chapter: 'reliability', title: 'Anti-flakiness: building tests you can trust', time: '40 min', visual: 'flaky',
      summary: 'A flaky test passes and fails without any change to the code. Flakiness erodes trust in the whole suite, so removing it is a core SDET skill.',
      sections: [

        ]},

          'Timing is the most frequent cause: the test acts before the page is ready. Other causes include unstable locators, shared or leftover test data, tests that only pass in a particular order, slow or differently configured environments, third-party services, and logic that depends on the current date or time.',

        ]},
        { h: 'The main fixes', p: [
          'Replace fixed sleeps with waits for a condition. Wait for a business outcome, such as a confirmation message, or for a specific network response. Assert that an element is visible and enabled before acting on it. Give each test its own data with its own setup and cleanup. Use API calls for setup when the user interface is not what you are testing, because API calls are faster and more stable.'
        ]},
        { h: 'Retries and quarantine', p: [
          'Retries help with short-lived environment problems such as a network blip. Make them visible: record which tests needed a retry, because a retry can also hide a real problem. Quarantine a test that keeps flaking by moving it to a separate job with a named owner and a deadline for the fix.'
        ]}

      example: {
        title: 'Worked example: replacing a sleep with a real outcome',

          ]

      keypoints: [

    /* ============================ SYSTEM DESIGN ============================ */
    {
      id: 'architecture', chapter: 'system', title: 'Architecture styles for testers', time: '45 min', visual: 'architecture',
      summary: 'A tester cannot test a system well without knowing its parts. Architecture shows where requests travel, where data lives and where failures can start.',
      sections: [
        { h: 'Why architecture matters to testing', p: [
          'Every boundary between components is a place where something can fail: a network call can time out, a message can arrive twice, a service can return data in an unexpected shape. Knowing the architecture tells you where to aim your tests and which failures are most likely.'
        ]},
        { h: 'Common architecture styles', p: [
          'A monolith is one deployable application. It is simple to build and test, but a large team working in one codebase can slow each other down. A modular monolith keeps a single deployment and enforces clear boundaries between internal modules. Microservices split the system into small services that each own their data and deployment. They give teams independence, but every call between services can fail, and the system is harder to test end to end.',
          'Event-driven systems communicate through events, such as "order placed", rather than direct calls. Producers do not need to know who consumes the event, which decouples the parts but makes the flow harder to follow. Serverless systems run small functions on demand and scale automatically, with the trade-off of cold starts and vendor-specific behavior.'
        ]},
        { h: 'Layers and boundaries', p: [
          'Layered architecture separates presentation, business logic and data. Hexagonal architecture goes further: the business logic knows nothing about the database or the user interface, and both connect to it through defined ports. That independence makes the core logic easy to test without starting the whole system.'
        ]},
        { h: 'What it means for tests', p: [
          'A monolith needs strong end-to-end and integration coverage. Microservices need contract tests, which confirm that a consumer and a provider agree on the shape of their messages, plus monitoring that follows a request across services. Event-driven systems need tests for delayed messages, duplicate messages and messages that arrive out of order.'
        ]}
      ],
      example: {
        title: 'Worked example: testing an order flow across services',
        text: 'An online order passes through four components. The table maps each boundary to the kind of test that gives the most useful signal.',

            ['Checkout to order database', 'Order saved with a missing or duplicate row', 'Database check'],
            ['Order service to email service', 'Confirmation sent twice after a retry', 'Integration test with a fake broker'],

          ]
        },

        'Use contract tests between services that change independently.',

    {
      id: 'data-scale', chapter: 'system', title: 'Read-heavy and write-heavy systems', time: '45 min', visual: 'cache',
      summary: 'Most products are read-heavy. Estimating the read-to-write ratio first tells you which design choices, and which tests, matter most.',
      sections: [
        { h: 'Read-heavy and write-heavy', p: [
          'A read-heavy system serves many more reads than writes. A product catalog or news feed is read-heavy: many people view, few people change. A write-heavy system receives a steady flood of writes, such as telemetry, logs or order events. Before you design anything, estimate the ratio, because it drives almost every later decision.'
        ]},
        { h: 'Estimating load', p: [
          'Back-of-the-envelope estimation converts a product description into numbers. Suppose 100 million new links are created each month. That is about 40 writes per second on average. With a 100-to-1 read ratio, reads are about 4,000 per second. Peak traffic is usually several times the average, so a design should handle the peak, not just the mean.'
        ]},
        { h: 'Tools for read-heavy load', p: [
          'A cache keeps answers in fast memory. The most common pattern is cache-aside: check the cache first and, on a miss, read the database and store the result for later requests. Read replicas spread queries across copies of the database. A content delivery network (CDN) serves static files from locations close to users.'
        ]},
        { h: 'Tools for write-heavy load', p: [
          'A queue absorbs bursts so workers can process messages at their own pace. Batching combines many small writes into fewer, larger ones. Partitioning, also called sharding, spreads data across several servers. Append-only logs make writes fast because they only add to the end of a file.'
        ]},
        { h: 'Consistency trade-offs', p: [
          'A cache can return stale data, so you must decide how stale is acceptable and how the cache is invalidated when the source changes. The CAP theorem states that when a network partition splits a distributed system, it must choose between consistency and availability. PACELC adds that even without a partition, there is a trade-off between latency and consistency.'
        ]}
      ],
      example: {
        title: 'Worked example: estimating and caching a URL shortener',
        text: 'The estimate below decides whether a cache is worth it. The code shows the cache-aside logic a tester would verify.',
        table: {
          head: ['Quantity', 'Calculation', 'Result'],
          rows: [
            ['New links per second', '100,000,000 / (30 days × 86,400 s)', 'About 40 writes per second'],
            ['Reads per second (average)', '40 × 100 read-to-write ratio', 'About 4,000 reads per second'],
            ['Reads per second (peak, 3×)', '4,000 × 3', 'About 12,000 reads per second'],
            ['Share of reads that are repeats', 'Popular links are clicked many times', 'Assume 80 percent: a cache is worth it']
          ]
        },
        code: { lang: 'python', code: "def get_long_url(short_code, cache, db, ttl_seconds=300):\n    url = cache.get(short_code)          # 1. try the cache first\n    if url is not None:\n        return url                       # cache hit: fast path\n    url = db.find_long_url(short_code)   # 2. cache miss: read the source of truth\n    if url is not None:\n        cache.set(short_code, url, ttl_seconds)  # 3. keep it for next time\n    return url" },
        after: 'At 12,000 peak reads per second, serving every read from the database would overload a typical single instance. With an 80 percent hit rate, only about 2,400 reads per second reach the database. The tester’s job here is to check both paths, a hit and a miss, and to check that a changed URL is not served stale after its time-to-live.'
      },
      keypoints: [
        'Measure the read-to-write ratio before choosing a design.',
        'Design for peak load, not the average.',
        'Cache invalidation is the hard part; test it explicitly.',
        'Decide, with stakeholders, how stale data may be.'
      ],
      task: 'For a product catalog with 2 million daily page views and 5,000 product updates per day, estimate reads and writes per second, then choose one caching strategy and justify it in three sentences.',
      quiz: {
        q: 'In cache-aside, what happens on a cache miss?',
        o: ['The request fails', 'The application reads the database, then stores the value in the cache', 'The cache creates the data itself', 'The CDN is cleared'],
        a: 1,
        e: 'On a miss the application loads the value from the source of truth and fills the cache, so the next request is fast.'
      }
    },

    /* ============================ QUALITY OPERATIONS ============================ */
    {
      id: 'database-testing', chapter: 'quality', title: 'Database testing and SQL validation', time: '40 min', visual: 'scan',
      summary: 'Some defects exist only in stored data: wrong totals, duplicate records, orphaned rows. User interface tests cannot see them, so testers check the database directly.',
      sections: [

        ]},
        { h: 'SQL you need first', p: [
          'SELECT with WHERE, ORDER BY and GROUP BY covers most checks. JOIN combines related tables. A LEFT JOIN with a condition that the right side is NULL finds orphans, which are child rows with no parent. COUNT and SUM compare totals. Window functions such as ROW_NUMBER help when you need to rank rows or find the second of two duplicates.'
        ]},
        { h: 'Validation patterns', p: [
          'Compare row counts between a source and a target after a migration. Check that required columns contain no nulls. Find duplicates by grouping on the business key and keeping groups with more than one row. Confirm that every foreign key points to an existing row. Compare sums or checksums to confirm that values moved without change.'
        ]},
        { h: 'Transactions and cleanup', p: [
          'A transaction groups statements so that all of them succeed or none of them do. Test setup can run inside a transaction that is rolled back at the end, which leaves the database as it was. Be aware that concurrent tests can see each other’s uncommitted data depending on the isolation level.'
        ]}
      ],
      example: {
        title: 'Worked example: three validation queries after an order is placed',
        text: 'After the UI places an order, these queries confirm the stored data is complete and consistent.',
        code: { lang: 'sql', code: "-- 1. The new order exists exactly once\nSELECT COUNT(*) AS n FROM orders WHERE external_ref = 'TEST-1001';   -- expect 1\n\n-- 2. Every order line belongs to an existing order (no orphans)\nSELECT l.id\nFROM order_lines l\nLEFT JOIN orders o ON o.id = l.order_id\nWHERE o.id IS NULL;                                                    -- expect 0 rows\n\n-- 3. The stored total equals the sum of its lines\nSELECT o.id, o.total, SUM(l.amount) AS lines_total\nFROM orders o\nJOIN order_lines l ON l.order_id = o.id\nWHERE o.external_ref = 'TEST-1001'\nGROUP BY o.id, o.total\nHAVING o.total <> SUM(l.amount);                                       -- expect 0 rows" },
